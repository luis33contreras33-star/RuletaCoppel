<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta - Tu confianza se recompensa</title>

<style>
:root{
  --coppel-blue:#0B4FB6;
  --coppel-yellow:#FFD400;
}

body{
  margin:0;
  background:#f4f6fb;
  font-family:Arial, Helvetica, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  text-align:center;
  width:100%;
  max-width:600px;
}

h1{
  color:var(--coppel-blue);
  font-size:22px;
  margin-bottom:20px;
}

.wheel-wrapper{
  position:relative;
  width:100%;
  max-width:520px;
  margin:auto;
}

canvas{
  width:100%;
  height:auto;
}

.pointer{
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:25px solid var(--coppel-blue);
  margin:auto;
}

button{
  margin-top:25px;
  padding:14px 25px;
  font-size:16px;
  border:none;
  background:var(--coppel-yellow);
  color:#000;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}
</style>
</head>

<body>

<div class="container">
  <h1>Tu confianza se recompensa, gira y aprovecha.</h1>

  <div class="pointer"></div>

  <div class="wheel-wrapper">
    <canvas id="wheel" width="500" height="500"></canvas>
  </div>

  <button onclick="spin()">Girar Ruleta</button>
</div>

<script>
const options = [
  "10% descuento en Ropa",
  "10% descuento en Muebles",
  "10% descuento en Óptica",
  "10% en próxima visita",
  "Doble oportunidad",
  "10% descuento en Ropa"
];

const colors = [
  "#0B4FB6",
  "#FFD400",
  "#0B4FB6",
  "#FFD400",
  "#0B4FB6",
  "#FFD400"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const radius = canvas.width / 2;

function drawWheel(rotation = 0){
  const arc = (2 * Math.PI) / options.length;

  for(let i = 0; i < options.length; i++){
    const angle = i * arc + rotation;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, angle, angle + arc);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.save();

    ctx.translate(centerX, centerY);
    ctx.rotate(angle + arc / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = colors[i] === "#FFD400" ? "#000" : "#fff";
    ctx.font = "bold 14px Arial";
    ctx.fillText(options[i], radius - 15, 5);
    ctx.restore();
  }
}

let rotation = 0;
let spinning = false;

function spin(){
  if(spinning) return;
  spinning = true;

  const spinAngle = Math.random() * 2000 + 2000;
  const duration = 3000;
  const start = performance.now();

  function animate(time){
    const progress = time - start;
    const ease = 1 - Math.pow(1 - progress / duration, 3);
    rotation = (spinAngle * ease) * Math.PI / 180;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawWheel(rotation);

    if(progress < duration){
      requestAnimationFrame(animate);
    } else {
      spinning = false;
    }
  }

  requestAnimationFrame(animate);
}

drawWheel();
</script>

</body>
</html>
