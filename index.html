<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ruleta - Tu confianza se recompensa</title>
  <style>
    :root{
      --coppel-blue:#0B4FB6;
      --coppel-yellow:#FFD400;
      --gray:#E9EDF3;
      --bg:#F6F8FF;
      --ink:#0c1b3a;
      --muted:#6b7280;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg,#ffffff 0%, var(--bg) 55%, #ffffff 100%);
      color:var(--ink);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px 12px;
    }
    .wrap{
      width:min(560px, 96vw);
    }

    .title{
      background: linear-gradient(180deg, var(--coppel-blue) 0%, #083D93 100%);
      color:#fff;
      border-radius: 22px;
      padding: 18px 16px;
      text-align:center;
      box-shadow: 0 18px 45px rgba(11,79,182,.18);
      margin-bottom: 14px;
    }
    .title h1{
      margin:0;
      font-weight: 900;
      font-size: clamp(18px, 4.6vw, 28px);
      line-height: 1.15;
      text-shadow: 0 2px 0 rgba(0,0,0,.12);
    }

    .card{
      background: #fff;
      border-radius: 22px;
      padding: 16px 14px 14px;
      box-shadow: 0 20px 60px rgba(12,27,58,.12);
      border: 1px solid rgba(11,79,182,.10);
      text-align:center;
    }

    .brand{
      font-weight: 900;
      color: var(--coppel-blue);
      margin: 2px 0 10px;
      letter-spacing:.3px;
    }

    .wheelArea{
      position:relative;
      width:min(520px, 92vw);
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Flecha */
    .pointer{
      position:absolute;
      top:-6px;
      left:50%;
      transform:translateX(-50%);
      width:0;height:0;
      border-left:18px solid transparent;
      border-right:18px solid transparent;
      border-top:34px solid var(--coppel-yellow);
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.14));
      z-index: 20;
    }

    /* Aro externo */
    .ring{
      position:absolute;
      inset: 2.8%;
      border-radius:999px;
      border: 14px solid var(--coppel-blue);
      box-shadow: inset 0 0 0 8px rgba(255,212,0,.30);
      pointer-events:none;
      z-index: 2;
    }

    canvas{
      width:100%;
      height:100%;
      border-radius:999px;
      background:#fff;
      z-index: 1;
    }

    /* Centro */
    .center{
      position:absolute;
      inset: 36%;
      border-radius:999px;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9) 0%, rgba(255,255,255,.25) 35%, rgba(255,255,255,0) 58%),
                  radial-gradient(circle at 50% 55%, var(--coppel-yellow) 0%, #ffdf35 55%, #ffd400 100%);
      border: 10px solid var(--coppel-blue);
      box-shadow: 0 18px 50px rgba(12,27,58,.16);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      z-index: 10;
      padding: 10px;
      text-align:center;
    }
    .center span{
      font-weight: 950;
      color: #083D93;
      font-size: clamp(18px, 4.8vw, 30px);
      line-height: 1.0;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .hint{
      margin-top: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .btn{
      margin-top: 14px;
      border:0;
      background: var(--coppel-yellow);
      color:#1b2a52;
      font-weight: 950;
      padding: 14px 18px;
      border-radius: 14px;
      cursor:pointer;
      box-shadow: 0 14px 30px rgba(12,27,58,.12);
      font-size: 18px;
      letter-spacing:.2px;
    }
    .btn:active{ transform: translateY(1px); }

    /* Resultado simple */
    .result{
      margin-top: 14px;
      display:none;
      border-radius: 16px;
      padding: 12px 12px;
      background: rgba(11,79,182,.06);
      border: 1px solid rgba(11,79,182,.14);
      text-align:left;
    }
    .result .label{
      font-weight: 900;
      color: var(--coppel-blue);
      margin-bottom: 4px;
      letter-spacing:.2px;
    }
    .result .text{
      font-weight: 850;
      font-size: 16px;
      margin: 0;
    }

    /* Confetti */
    .confetti{
      position: fixed;
      inset: 0;
      pointer-events:none;
      overflow:hidden;
      z-index: 9999;
      display:none;
    }
    .confetti i{
      position:absolute;
      top:-12px;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      animation: fall 1200ms linear forwards;
      opacity:.95;
    }
    @keyframes fall{
      to{
        transform: translateY(110vh) rotate(520deg);
        opacity: 1;
      }
    }

    @media (max-width:420px){
      .pointer{ border-left-width:16px; border-right-width:16px; border-top-width:30px; }
      .ring{ border-width: 12px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="title">
      <h1>Tu confianza se recompensa,<br/>gira y aprovecha.</h1>
    </div>

    <div class="card">
      <div class="brand">Coppel</div>

      <div class="wheelArea">
        <div class="pointer" aria-hidden="true"></div>
        <div class="ring" aria-hidden="true"></div>
        <canvas id="wheel" width="900" height="900"></canvas>

        <div class="center" id="tapCenter" role="button" aria-label="Girar ruleta">
          <span>¡GIRA<br/>AQUÍ!</span>
        </div>
      </div>

      <div class="hint">Toca el centro para girar</div>

      <button class="btn" id="spinBtn">Girar Ruleta</button>

      <div class="result" id="resultBox">
        <div class="label">Resultado</div>
        <p class="text" id="resultText">—</p>
      </div>
    </div>
  </div>

  <div class="confetti" id="confetti"></div>

  <script>
    // === Premios (los mismos que venías usando) ===
    // Si quieres cambiar el texto exacto, solo edita aquí.
    const prizes = [
      "10% descuento en Ropa",
      "10% descuento en Muebles",
      "10% descuento en Óptica",
      "10% en próxima visita",
      "Doble oportunidad",
      "Doble oportunidad"
    ];

    // Colores alternados (azul / amarillo / gris) para que no se junten iguales
    const palette = [
      { fill:"#0B4FB6", text:"#ffffff" }, // azul
      { fill:"#FFD400", text:"#0c1b3a" }, // amarillo
      { fill:"#E9EDF3", text:"#0c1b3a" }, // gris claro
      { fill:"#0B4FB6", text:"#ffffff" },
      { fill:"#FFD400", text:"#0c1b3a" },
      { fill:"#E9EDF3", text:"#0c1b3a" },
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const tapCenter = document.getElementById("tapCenter");
    const resultBox = document.getElementById("resultBox");
    const resultText = document.getElementById("resultText");

    let currentAngle = 0;
    let spinning = false;

    function normalizeAngle(a){
      const two = Math.PI*2;
      return (a % two + two) % two;
    }

    function drawWheel(){
      const W = canvas.width, H = canvas.height;
      const cx = W/2, cy = H/2;
      ctx.clearRect(0,0,W,H);

      const radius = Math.min(W,H) * 0.44;
      const slice = (2*Math.PI) / prizes.length;

      // Slices
      for(let i=0;i<prizes.length;i++){
        const start = currentAngle + i*slice;
        const end = start + slice;
        const col = palette[i % palette.length];

        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,radius,start,end);
        ctx.closePath();
        ctx.fillStyle = col.fill;
        ctx.fill();

        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(11,79,182,.18)";
        ctx.stroke();
      }

      // Text
      for(let i=0;i<prizes.length;i++){
        const mid = currentAngle + i*slice + slice/2;
        const col = palette[i % palette.length];
        const label = prizes[i];

        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(mid);

        const textRadius = radius * 0.70;
        let fontSize = 34;
        ctx.font = `900 ${fontSize}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
        const maxWidth = radius * 0.60;

        while(ctx.measureText(label).width > maxWidth && fontSize > 22){
          fontSize -= 2;
          ctx.font = `900 ${fontSize}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
        }

        ctx.fillStyle = col.text;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.save();
        ctx.translate(0, -textRadius);
        ctx.rotate(-Math.PI/2);

        ctx.shadowColor = "rgba(0,0,0,.18)";
        ctx.shadowBlur = 6;
        ctx.fillText(label, 0, 0);

        ctx.restore();
        ctx.restore();
      }
    }

    function pickWinnerIndex(){
      // Ganador uniforme (como lo teníamos)
      return Math.floor(Math.random() * prizes.length);
    }

    function launchConfetti(){
      const layer = document.getElementById("confetti");
      layer.innerHTML = "";
      layer.style.display = "block";

      const colors = ["#0B4FB6","#083D93","#FFD400","#E9EDF3"];
      const n = 60;

      for(let i=0;i<n;i++){
        const p = document.createElement("i");
        p.style.left = (Math.random()*100) + "vw";
        p.style.background = colors[i % colors.length];
        p.style.animationDelay = (Math.random()*180) + "ms";
        p.style.animationDuration = (900 + Math.random()*700) + "ms";
        p.style.width = (6 + Math.random()*8) + "px";
        p.style.height = (10 + Math.random()*14) + "px";
        p.style.transform = `translateY(-10px) rotate(${Math.random()*360}deg)`;
        layer.appendChild(p);
      }

      setTimeout(()=>{ layer.style.display = "none"; }, 1400);
    }

    function showResult(label){
      resultBox.style.display = "block";
      resultText.textContent = "Ganaste: " + label;

      launchConfetti();

      // Si sale doble, dejamos listo para que vuelvas a girar
      if(label.toLowerCase().includes("doble")){
        // Mensaje extra opcional (sin alargar)
        // resultText.textContent = "Ganaste: Doble oportunidad (vuelve a girar)";
      }
    }

    function spin(){
      if(spinning) return;
      spinning = true;

      const winnerIndex = pickWinnerIndex();
      const slice = (2*Math.PI) / prizes.length;

      // Centro del segmento ganador
      const winnerMid = winnerIndex*slice + slice/2;

      // Puntero arriba (-90°)
      const pointerAngle = -Math.PI/2;

      // Queremos: currentAngle + winnerMid = pointerAngle (mod 2pi)
      const targetAngle = pointerAngle - winnerMid;

      const currentNorm = normalizeAngle(currentAngle);
      const targetNorm = normalizeAngle(targetAngle);

      let delta = targetNorm - currentNorm;
      if(delta < 0) delta += Math.PI*2;

      const extraTurns = 6 + Math.floor(Math.random()*3); // 6-8 vueltas
      const finalAngle = currentAngle + extraTurns*(Math.PI*2) + delta;

      const duration = 2400 + Math.random()*400;
      const start = performance.now();
      const from = currentAngle;

      function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }

      function tick(now){
        const t = Math.min(1, (now-start)/duration);
        currentAngle = from + (finalAngle-from)*easeOutCubic(t);
        drawWheel();

        if(t < 1) requestAnimationFrame(tick);
        else{
          spinning = false;
          showResult(prizes[winnerIndex]);
        }
      }
      requestAnimationFrame(tick);
    }

    spinBtn.addEventListener("click", spin);
    tapCenter.addEventListener("click", spin);

    drawWheel();
  </script>
</body>
</html>
