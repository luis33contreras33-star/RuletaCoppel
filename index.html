<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta - Tu confianza se recompensa</title>

<style>
:root{
  --coppel-blue:#0B4FB6;
  --coppel-yellow:#FFD400;
  --bg:#f2f2f2;
}

body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1{
  color:var(--coppel-blue);
  font-size:26px;
  max-width:500px;
}

.wrapper{
  position:relative;
  margin-top:20px;
}

canvas{
  background:#fff;
  border-radius:50%;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.pointer{
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-bottom:30px solid var(--coppel-blue);
  position:absolute;
  top:-30px;
  left:50%;
  transform:translateX(-50%);
}

button{
  margin-top:25px;
  padding:15px 40px;
  background:var(--coppel-yellow);
  border:none;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

button:hover{
  transform:scale(1.05);
}

.result{
  margin-top:25px;
  font-size:20px;
  background:#fff;
  padding:15px 25px;
  border-radius:10px;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
  display:none;
}
</style>
</head>

<body>

<h1>Tu confianza se recompensa, gira y aprovecha.</h1>

<div class="wrapper">
  <div class="pointer"></div>
  <canvas id="wheel" width="400" height="400"></canvas>
</div>

<button onclick="spin()">Girar Ruleta</button>

<div class="result" id="result"></div>

<script>
const options = [
"10% descuento en Ropa",
"10% descuento en Muebles",
"10% descuento en Óptica",
"10% en próxima visita",
"Doble oportunidad",
"10% descuento en Ropa"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const size = canvas.width;
const center = size / 2;
const radius = size / 2;

function drawWheel(){
  const arc = (2*Math.PI) / options.length;

  for(let i=0;i<options.length;i++){
    ctx.beginPath();
    ctx.moveTo(center,center);
    ctx.arc(center,center,radius,i*arc,(i+1)*arc);
    ctx.fillStyle = i%2===0 ? "#0B4FB6" : "#FFD400";
    ctx.fill();
    ctx.save();
    ctx.translate(center,center);
    ctx.rotate(i*arc + arc/2);
    ctx.textAlign="right";
    ctx.fillStyle = i%2===0 ? "#fff" : "#000";
    ctx.font="bold 14px Arial";
    ctx.fillText(options[i], radius-10,5);
    ctx.restore();
  }
}

drawWheel();

let angle=0;
let spinning=false;

function spin(){
  if(spinning) return;
  spinning=true;

  const spinAngle = Math.random()*3000 + 2000;
  const start = performance.now();

  function animate(time){
    const progress = time - start;
    const rotation = spinAngle * easeOut(progress/4000);
    angle = rotation;

    ctx.clearRect(0,0,size,size);
    ctx.save();
    ctx.translate(center,center);
    ctx.rotate(angle * Math.PI/180);
    ctx.translate(-center,-center);
    drawWheel();
    ctx.restore();

    if(progress<4000){
      requestAnimationFrame(animate);
    }else{
      finish();
    }
  }

  requestAnimationFrame(animate);
}

function easeOut(t){
  return 1 - Math.pow(1 - t, 3);
}

function finish(){
  const arc = 360/options.length;
  const degrees = angle % 360;
  const index = Math.floor((360 - degrees) / arc) % options.length;

  document.getElementById("result").innerText =
  "🎉 ¡Felicidades! Ganaste: " + options[index];

  document.getElementById("result").style.display="block";
  spinning=false;
}
</script>

</body>
</html>
